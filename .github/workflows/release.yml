name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: simple
          package-name: silimon

  update-homebrew:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: macos-latest
    steps:
      - name: Calculate SHA256
        id: sha
        run: |
          VERSION="${{ needs.release-please.outputs.tag_name }}"
          URL="https://github.com/odfalik/silimon/archive/refs/tags/${VERSION}.tar.gz"
          SHA=$(curl -sL "$URL" | shasum -a 256 | cut -d' ' -f1)
          echo "sha256=${SHA}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone https://x-access-token:${GH_TOKEN}@github.com/odfalik/homebrew-silimon.git
          cd homebrew-silimon

          cat > Formula/silimon.rb << 'FORMULA'
          # Homebrew formula for Silimon
          # Auto-updated by GitHub Actions

          class Silimon < Formula
            desc "Apple Silicon performance monitor for your menu bar"
            homepage "https://github.com/odfalik/silimon"
          FORMULA

          echo "  url \"https://github.com/odfalik/silimon/archive/refs/tags/${{ steps.sha.outputs.version }}.tar.gz\"" >> Formula/silimon.rb
          echo "  sha256 \"${{ steps.sha.outputs.sha256 }}\"" >> Formula/silimon.rb

          cat >> Formula/silimon.rb << 'FORMULA'
            license "MIT"
            head "https://github.com/odfalik/silimon.git", branch: "main"

            depends_on :macos
            depends_on xcode: ["14.0", :build]

            def install
              system "swift", "build", "-c", "release", "--disable-sandbox"
              bin.install ".build/release/silimon"
              (pkgshare/"scripts").install "Scripts/setup-sudo.sh"
              (pkgshare/"scripts").install "Scripts/uninstall.sh"
            end

            def caveats
              <<~EOS
                Silimon monitors Apple Silicon performance metrics in your menu bar.

                To start silimon:
                  silimon

                First run may require: sudo silimon
                Or run: $(brew --prefix)/share/silimon/scripts/setup-sudo.sh
              EOS
            end

            test do
              assert_match "silimon", shell_output("#{bin}/silimon --help 2>&1", 0)
            end
          end
          FORMULA

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/silimon.rb
          git commit -m "Update silimon to ${{ steps.sha.outputs.version }}"
          git push
