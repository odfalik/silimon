name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: macos-latest
    outputs:
      sha256: ${{ steps.build.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Build release binary
        id: build
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"

          # Build the release binary
          swift build -c release --disable-sandbox

          # Create tarball with just the binary
          TARBALL="silimon-${VERSION}-arm64.tar.gz"
          tar -czvf "$TARBALL" -C .build/release silimon

          # Calculate SHA256
          SHA256=$(shasum -a 256 "$TARBALL" | cut -d' ' -f1)
          echo "sha256=${SHA256}" >> $GITHUB_OUTPUT
          echo "tarball=${TARBALL}" >> $GITHUB_OUTPUT

          echo "Built $TARBALL with SHA256: $SHA256"

      - name: Upload binary to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} ${{ steps.build.outputs.tarball }} --clobber

  update-homebrew:
    needs: [release-please, build-and-upload]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ needs.release-please.outputs.version }}"
          TAG="${{ needs.release-please.outputs.tag_name }}"
          SHA256="${{ needs.build-and-upload.outputs.sha256 }}"

          git clone https://x-access-token:${GH_TOKEN}@github.com/odfalik/homebrew-silimon.git
          cd homebrew-silimon

          # Generate formula using echo to avoid heredoc YAML issues
          {
            echo '# Homebrew formula for Silimon'
            echo '# Auto-updated by GitHub Actions on new releases'
            echo ''
            echo 'class Silimon < Formula'
            echo '  desc "Apple Silicon performance monitor for your menu bar"'
            echo '  homepage "https://github.com/odfalik/silimon"'
            echo "  url \"https://github.com/odfalik/silimon/releases/download/${TAG}/silimon-${VERSION}-arm64.tar.gz\""
            echo "  version \"${VERSION}\""
            echo "  sha256 \"${SHA256}\""
            echo '  license "MIT"'
            echo ''
            echo '  depends_on arch: :arm64'
            echo '  depends_on macos: :ventura'
            echo ''
            echo '  def install'
            echo '    bin.install "silimon"'
            echo '  end'
            echo ''
            echo '  def caveats'
            echo '    <<~EOS'
            echo '      Silimon monitors Apple Silicon performance metrics in your menu bar.'
            echo ''
            echo '      Features:'
            echo '        - Real-time power consumption (CPU, GPU, ANE)'
            echo '        - CPU cluster frequencies (E-cores vs P-cores)'
            echo '        - Memory usage and pressure'
            echo '        - GPU utilization'
            echo '        - Network throughput'
            echo '        - Battery status'
            echo ''
            echo '      No sudo required! Start silimon with:'
            echo '        silimon'
            echo ''
            echo '      If metrics are not working, open Settings and click "Diagnose"'
            echo '      to run system diagnostics.'
            echo '    EOS'
            echo '  end'
            echo ''
            echo '  test do'
            echo '    assert_match "silimon", shell_output("#{bin}/silimon --version")'
            echo '  end'
            echo 'end'
          } > Formula/silimon.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/silimon.rb
          git commit -m "Update silimon to ${TAG}"
          git push
