name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Open Silimon
        2. Click on...
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS Version
      description: "e.g., macOS 14.2 Sonoma"
      placeholder: macOS 14.2
    validations:
      required: true

  - type: input
    id: mac
    attributes:
      label: Mac Model
      description: "e.g., MacBook Pro M3 Pro"
      placeholder: MacBook Pro M3 Pro
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Silimon Version
      description: "Run `silimon --version` or check Homebrew"
      placeholder: "0.2.0"

  - type: textarea
    id: logs
    attributes:
      label: Console Logs (if applicable)
      description: Any relevant logs from Console.app (filter by "silimon")
      render: shell

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, screenshots, or information
